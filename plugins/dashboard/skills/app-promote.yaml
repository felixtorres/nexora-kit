name: dashboard_app_promote
description: >
  Confirm a dashboard app is ready for sharing. Usually not needed — app_create
  already saves the dashboard. Use this only to verify a dashboard ID exists
  before sharing, or to promote raw HTML manually.
invocation: model
parameters:
  dashboardId:
    type: string
    description: Dashboard ID returned by app_create (preferred — use this instead of html)
  html:
    type: string
    description: Raw HTML content (only if dashboardId is not available)
  title:
    type: string
    description: Dashboard title (required only when using html)
